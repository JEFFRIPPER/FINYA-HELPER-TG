name: Sync encrypted FINYA secrets

on:
  push:
    branches: [main]
    paths:
      - ".gitverse/sync-secrets.trigger"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$OPENROUTER_API_KEY"
          test -n "$GROQ_API_KEY"

      - name: Build encrypted bundle
        shell: bash
        run: |
          mkdir -p config
          python - <<'PY'
          import json, os
          payload = {
              "OPENROUTER_API_KEY": os.environ["OPENROUTER_API_KEY"],
              "GROQ_API_KEY": os.environ["GROQ_API_KEY"],
          }
          with open("/tmp/finya-secrets.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY
          openssl enc -aes-256-cbc -pbkdf2 -salt             -in /tmp/finya-secrets.json             -out config/finya-secrets.enc             -pass env:TELEGRAM_BOT_TOKEN
          rm -f /tmp/finya-secrets.json

      - name: Commit encrypted bundle
        shell: bash
        run: |
          git config user.name "gitverse-actions"
          git config user.email "actions@gitverse.ru"
          git add config/finya-secrets.enc
          if git diff --cached --quiet; then
            echo "Encrypted bundle is unchanged"
            exit 0
          fi
          git commit -m "Update encrypted FINYA secrets"
          git push origin HEAD:main
