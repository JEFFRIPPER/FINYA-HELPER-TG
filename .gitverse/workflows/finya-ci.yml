name: FINYA CI and secrets check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile bot.py ai_service.py run_background.py watchdog.py

      - name: Check TELEGRAM_BOT_TOKEN
        continue-on-error: true
        shell: bash
        run: test -n "$TELEGRAM_BOT_TOKEN"

      - name: Check OPENROUTER_API_KEY
        continue-on-error: true
        shell: bash
        run: test -n "$OPENROUTER_API_KEY"

      - name: Check GROQ_API_KEY
        continue-on-error: true
        shell: bash
        run: test -n "$GROQ_API_KEY"

      - name: Verify Telegram token
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os, httpx
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN missing")
          r = httpx.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20)
          if r.status_code >= 400 or not r.json().get("ok"):
              raise SystemExit(f"Telegram auth failed: HTTP {r.status_code}")
          print("Telegram auth: OK")
          PY

      - name: Verify OpenRouter key
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os, httpx
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key:
              raise SystemExit("OPENROUTER_API_KEY missing")
          r = httpx.get("https://openrouter.ai/api/v1/key", headers={"Authorization": f"Bearer {key}"}, timeout=20)
          if r.status_code >= 400:
              raise SystemExit(f"OpenRouter auth failed: HTTP {r.status_code}")
          print("OpenRouter auth: OK")
          PY

      - name: Verify Groq key
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os, httpx
          key = os.environ.get("GROQ_API_KEY", "").strip()
          if not key:
              raise SystemExit("GROQ_API_KEY missing")
          r = httpx.get("https://api.groq.com/openai/v1/models", headers={"Authorization": f"Bearer {key}"}, timeout=20)
          if r.status_code >= 400:
              raise SystemExit(f"Groq auth failed: HTTP {r.status_code}")
          print("Groq auth: OK")
          PY

      - name: Validate GitVerse secrets and provider auth
        shell: bash
        run: |
          python - <<'PY'
          import os
          import httpx

          required = ["TELEGRAM_BOT_TOKEN", "OPENROUTER_API_KEY", "GROQ_API_KEY"]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing repository secrets: " + ", ".join(missing))

          checks = [
              ("Telegram", f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/getMe", {}),
              ("OpenRouter", "https://openrouter.ai/api/v1/key",
               {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"}),
              ("Groq", "https://api.groq.com/openai/v1/models",
               {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}),
          ]
          with httpx.Client(timeout=20) as client:
              for name, url, headers in checks:
                  response = client.get(url, headers=headers)
                  if response.status_code >= 400:
                      raise SystemExit(f"{name} auth failed: HTTP {response.status_code}")
                  print(f"{name}: OK")
          PY
