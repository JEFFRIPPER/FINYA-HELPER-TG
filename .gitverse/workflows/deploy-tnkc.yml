name: Deploy FINYA to TNKC-WORLD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Sync project and Telegram secret
        shell: powershell
        run: |
          $repo = "C:\Users\TNKC\FINYA-HELPER"
          Set-Location $repo
          git fetch origin main
          git reset --hard origin/main

          if (-not $env:TELEGRAM_BOT_TOKEN) { throw "Missing secret: TELEGRAM_BOT_TOKEN" }

          [IO.File]::WriteAllLines(
              (Join-Path $repo ".env"),
              @("TELEGRAM_BOT_TOKEN=$env:TELEGRAM_BOT_TOKEN"),
              [Text.UTF8Encoding]::new($false)
          )

          python -m pip install -r requirements.txt
          python -m py_compile bot.py run_background.py watchdog.py

      - name: Restart FINYA HELPER
        shell: powershell
        run: |
          $repo = "C:\Users\TNKC\FINYA-HELPER"
          Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -match "^(python|pythonw|py)\.exe$" -and
              $_.CommandLine -match "FINYA-HELPER" -and
              $_.CommandLine -match "(watchdog\.py|run_background\.py)"
            } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          Start-Sleep -Seconds 2
          $python = (python -c "import sys; print(sys.executable)").Trim()
          $pythonw = Join-Path (Split-Path $python) "pythonw.exe"
          Start-Process -FilePath $pythonw -ArgumentList "watchdog.py" -WorkingDirectory $repo
          Start-Sleep -Seconds 5

          $heartbeat = Join-Path $repo "runtime\heartbeat.txt"
          if (-not (Test-Path $heartbeat)) { throw "Heartbeat was not created" }
          Write-Output "FINYA HELPER deploy OK"
