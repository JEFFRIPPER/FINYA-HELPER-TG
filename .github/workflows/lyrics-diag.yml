name: Lyrics diagnostic (temporary)

# Runs a read-only diagnostic module in the cloud with `tgcloud run` — nothing is deployed.
on:
  push:
    branches: [claude/lyrics-diag]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: mkdir -p .tgcloud
      - run: npx tgcloud fetch
      - name: Run diagnostic
        run: |
          npx tgcloud run endpoints/zdiag "{ mode: 'list' }" 2>&1 | grep -o "LIST .*" > diag.txt || true
          i=0
          while IFS= read -r u; do
            i=$((i+1))
            ( npx tgcloud run endpoints/zdiag "{ mode: 'raw', url: '$u' }" 2>&1 | grep -E "RAW|BODY" ) > "o_$i.txt" &
          done < ../diag/urls.txt
          wait
          cat o_*.txt >> diag.txt
      # Logs and artifacts are not readable from where this is debugged: the
      # result is committed to this temporary branch instead.
      - name: Save the result to the branch
        if: always()
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' diag.txt
          mkdir -p ../diag && cp diag.txt "../diag/run-${{ github.run_id }}.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ../diag && git commit -m "diag ${{ github.run_id }}" && git push
