name: Lyrics diagnostic (temporary)

# Runs a read-only diagnostic module in the cloud with `tgcloud run` — nothing is deployed.
on:
  push:
    branches: [claude/lyrics-diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: mkdir -p .tgcloud
      - run: npx tgcloud fetch
      - name: Run diagnostic
        run: |
          npx tgcloud run endpoints/zdiag "{ mode: 'list' }" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -o "LIST .*" > diag.txt || true
          for m in 'Перспективы' 'Что ты знаешь'; do
            i=0
            for s in 'Apple Music' 'Lyrics+' 'Musixmatch' 'LRCLIB' 'NetEase' 'QQ Music' 'Kugou' 'Deezer' 'LiriQo' 'Unison' 'Megalobiz' 'Genius' 'lyrics.ovh'; do
              i=$((i+1))
              ( (time npx tgcloud run endpoints/zdiag "{ mode: 'src', name: '$s', match: '$m' }") 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "^< |✗|^real|\[get\]" | tr '\n' ' '; echo " [$s]" ) > "o_$i.txt" &
            done
            wait
            cat o_*.txt >> diag.txt
            rm -f o_*.txt
          done
      # Logs and artifacts are not readable from where this is debugged; annotations are.
      - name: Publish as annotations
        if: always()
        run: >-
          node -e "const s=require('fs').readFileSync('diag.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          for(let i=0,n=0;i<s.length&&n<10;i+=6000,n++)console.log('::notice title=diag'+n+'::'+s.slice(i,i+6000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'))"
