name: Lyrics diagnostic (temporary)

# Runs a read-only diagnostic module in the cloud with `tgcloud run` — nothing is deployed.
on:
  push:
    branches: [claude/lyrics-diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: mkdir -p .tgcloud
      - run: npx tgcloud fetch
      - name: Run diagnostic
        run: |
          (time npx tgcloud run endpoints/zdiag '{ mode: "env" }') > d1.txt 2>&1 || true
          (time npx tgcloud run endpoints/zdiag '{}') > d2.txt 2>&1 || true
          (time npx tgcloud run endpoints/zdiag '{ mode: "hang", url: "https://httpbin.org/delay/12" }') > d3.txt 2>&1 || true
          (time npx tgcloud run endpoints/zdiag '{ mode: "hang", url: "http://10.255.255.1/" }') > d4.txt 2>&1 || true
          cat d1.txt d2.txt d3.txt d4.txt > diag.txt
      # Logs and artifacts are not readable from where this is debugged; annotations are.
      - name: Publish as annotations
        if: always()
        run: >-
          node -e "const s=require('fs').readFileSync('diag.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          for(let i=0,n=0;i<s.length&&n<10;i+=6000,n++)console.log('::notice title=diag'+n+'::'+s.slice(i,i+6000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'))"
