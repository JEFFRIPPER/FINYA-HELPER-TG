name: YooMoney probe

# Manual check: can GitHub's runners reach YooMoney, and does its API allow
# browser (CORS) calls? Telegram's cloud cannot reach yoomoney.ru at all.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reach yoomoney.ru
        run: |
          for url in https://yoomoney.ru/ https://yoomoney.ru/api/operation-history; do
            echo "== $url"
            curl -sS -o /dev/null -m 20 -w "status %{http_code} in %{time_total}s\n" -X POST "$url" || echo "failed"
          done
      - name: CORS headers
        run: |
          echo "== preflight"
          curl -sS -m 20 -D - -o /dev/null -X OPTIONS https://yoomoney.ru/api/operation-history \
            -H "Origin: https://jeffripper.github.io" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" || echo "failed"
          echo "== simple POST"
          curl -sS -m 20 -D - -o /dev/null -X POST https://yoomoney.ru/api/operation-history \
            -H "Origin: https://jeffripper.github.io" || echo "failed"
