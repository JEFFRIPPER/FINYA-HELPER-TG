name: Deploy to Telegram Serverless

# Manual only: the first push switches the bot's webhook to the platform,
# which stops the Railway (polling) bot from receiving updates.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напиши ПЕРЕЕЗД, чтобы задеплоить (Railway должен быть остановлен)'
        required: true
      drop_deprecated:
        description: 'Применить и опасные изменения базы (migrate --yes), например удалить таблицы .deprecated(): их данные пропадут навсегда'
        type: boolean
        default: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'ПЕРЕЕЗД' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: mkdir -p .tgcloud
      - name: Sync with the cloud
        run: npx tgcloud fetch
      - name: Deploy modules
        run: npx tgcloud push
      # --safe skips warning changes such as dropping a .deprecated() table;
      # --yes (drop_deprecated) applies them too.
      - name: Apply database schema
        run: npx tgcloud migrate ${{ inputs.drop_deprecated && '--yes' || '--safe' }}
      # Re-points the webhook at the platform every time: a leftover polling bot
      # (the old Python Финя) drops it with deleteWebhook when it starts.
      - name: Sync webhook
        run: npx tgcloud webhook sync
